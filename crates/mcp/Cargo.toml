[package]
name = "hwpcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hwpcraft-doc.workspace = true
hwpcraft-engine.workspace = true
hwpcraft-formats.workspace = true
hwpcraft-render.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
base64.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "net", "time", "signal"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "=0.60.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
