# Build HwpCraft for Windows, macOS and Linux and attach the archives to a
# GitHub release when a version tag (v0.14, v0.15, …) is pushed. RHWP is a
# path dependency, so its tagged source is checked out next to the project.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  RHWP_TAG: v0.8.7
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
    steps:
      # Windows runners convert checkouts to CRLF; the RHWP patches are LF and
      # `git apply` needs both sides to match, so keep every checkout byte-exact.
      - name: Keep checkouts byte-exact
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: hwpcraft
      - uses: actions/checkout@v4
        with:
          repository: edwardkim/rhwp
          ref: ${{ env.RHWP_TAG }}
          path: rhwp
      - name: Apply local RHWP patches (patches/rhwp/README.md)
        shell: bash
        run: |
          for p in hwpcraft/patches/rhwp/*.patch; do
            git -C rhwp apply --whitespace=nowarn "../$p"
          done
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
          rustup target add ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libfontconfig1-dev libssl-dev pkg-config fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hwpcraft
      - name: Build
        working-directory: hwpcraft
        run: cargo build --release --locked --target ${{ matrix.target }} -p hwpcraft -p hwpcraft-cli
      - name: Test (whole workspace)
        working-directory: hwpcraft
        run: cargo test --release --locked --target ${{ matrix.target }} --workspace
      - name: Package
        shell: bash
        working-directory: hwpcraft
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          NAME=HwpCraft-$VERSION-${{ matrix.name }}
          mkdir -p dist/$NAME/licenses
          cp target/${{ matrix.target }}/release/hwpcraft${{ matrix.exe }} target/${{ matrix.target }}/release/hwpcraft-cli${{ matrix.exe }} dist/$NAME/
          cp README.md LICENSE THIRD-PARTY-NOTICES.txt THIRD-PARTY-DEPENDENCIES.md VERSION dist/$NAME/
          cp assets/licenses/* dist/$NAME/licenses/
          cp assets/icons/lucide/LICENSE.txt dist/$NAME/licenses/LICENSE-Lucide-ISC.txt
          cp ../rhwp/LICENSE dist/$NAME/licenses/LICENSE-RHWP.txt
          BIN=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "macOS" ]; then
            # HwpCraft.app: double-click to start (the plain binaries stay alongside).
            APP=dist/$NAME/HwpCraft.app
            mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
            cp $BIN/hwpcraft $APP/Contents/MacOS/hwpcraft
            sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > $APP/Contents/Info.plist
            ICONSET=$(mktemp -d)/HwpCraft.iconset
            mkdir -p $ICONSET
            if (for s in 16 32 128 256 512; do
                  $BIN/hwpcraft --write-icon $ICONSET/icon_${s}x${s}.png $s &&
                  $BIN/hwpcraft --write-icon $ICONSET/icon_${s}x${s}@2x.png $((s * 2)) || exit 1
                done); then
              iconutil -c icns $ICONSET -o $APP/Contents/Resources/HwpCraft.icns
            else
              echo "App icon skipped (the $NAME binary cannot run on this runner)."
            fi
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/hwpcraft.desktop packaging/linux/install.sh dist/$NAME/
            chmod +x dist/$NAME/install.sh
            $BIN/hwpcraft --write-icon dist/$NAME/hwpcraft.png 256
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -tzip $NAME.zip $NAME; else tar czf $NAME.tar.gz $NAME; fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            hwpcraft/dist/*.zip
            hwpcraft/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
